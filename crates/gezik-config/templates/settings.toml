# Gezik settings. This file is portable: copy it to another computer (Windows,
# macOS or Linux) and it works the same. Changes apply as soon as you save.

# "auto" follows the system light/dark mode. Or name a theme: "light", "dark",
# or the file name of a theme in the themes folder (themes/nord.toml -> "nord").
theme = "auto"
theme-light = "light"
theme-dark = "dark"

# Where new tabs open: "{home}", "drives" (This PC), or any folder.
# Tokens like {home}, {documents}, {downloads} work on every OS.
start-folder = "{home}"

# Most frames drawn per second, e.g. while scrolling. Lower saves CPU on high refresh
# rate displays; 0 draws as many as the display shows.
max-fps = 120

# Folders pinned to the sidebar: a path, or { path, name, group } for an alias and a group:
# pinned = ["{documents}/Projects", { path = "D:/Work/gezik", name = "Gezik", group = "Work" }]
# Gezik updates this list when you pin, unpin, rename, group or reorder folders; your
# comments elsewhere in this file are kept.
# Comments inside the pinned list itself are not kept when Gezik updates it.
pinned = []

[layout]
# left | right | hidden
sidebar = "left"
# compact | comfortable
density = "comfortable"
# true: no fades on hover and popups.
reduce-motion = false

[view]
# How folders look. A folder you change keeps its own view; "Apply to all folders"
# in the View menu writes mode, sort, sort-dir, grid-size and group here.
mode = "list"          # list | grid | columns
sort = "name"          # name | modified | created | type | size | tags | rating
sort-dir = "asc"       # asc | desc
grid-size = "medium"   # small | medium | large
group = "none"         # none | type | date | size | tag | rating: the list's groups when a folder has no view of its own
icons = "system"       # system | gezik (Gezik's own icons, colored by the theme)
folder-sizes = "off"      # sizes of the folders shown: off (only when asked) | local (not on network folders) | all
thumbnails = true      # pictures and videos show a preview in the grid
# The same in every folder; the View menu changes these here too.
hide-extensions = false   # show names without their extension
folders-first = true      # folders before files in every sort
date-format = "system"    # relative | short | iso | system
size-format = "binary"    # binary (1024, KB) | decimal (1000, kB)
single-click-open = false # one click opens; Ctrl (Cmd) and Shift clicks still select
# show-hidden = true      # dot names and Windows' hidden items; default true (macOS: false)
show-system = false       # Windows only: protected system items (desktop.ini, $RECYCLE.BIN)

[files]
# Ask before moving to the trash (Delete).
confirm-trash = false
# Files copied or deleted at once: "auto" (SSD 6, spinning disk 1, network 4) or 1-16.
copy-threads = "auto"
# Read each copied file back and compare it with the original (copies take about twice as
# long); a file that differs is copied once more. Each job can change it in its ⋯ menu.
verify = false
# The most a copy or move may take, as "20 MB/s", "500 KB/s" or "1.5 GB/s" (1 MB = 1,000,000
# bytes); empty = no limit. Each job can change it in its ⋯ menu.
max-speed = ""

[archives]
# What double-clicking an archive does: open it with the system's program, or extract it
# next to itself.
double-click = "system"   # system | extract-here

[convert]
ffmpeg = ""               # path to ffmpeg; empty = Gezik's download, then PATH

[tools]
download = true           # offer to download 7-Zip, ffmpeg and pdfium when needed
seven-zip = ""            # path to 7-Zip; empty = Gezik's download, then PATH
diff = ""                 # an external compare program (WinMerge, Meld, Beyond Compare, FileMerge's opendiff…): a full path, a name on PATH or a macOS .app; empty = Gezik's own
diff-args = ["{left}", "{right}"]   # its arguments; {left} and {right} become the two paths
folder-diff = false       # also hand it two folders (otherwise Gezik compares folders itself)

[keyboard]
# What typing a letter on the file list does: "jump" goes to the first name starting with
# what you typed; "filter" opens the filter (Ctrl+F, or / ) with it.
typing = "jump"           # jump | filter

[history]
# Remember the folders you open, for the address bar's Recent and Frequent lists (kept in
# state.toml). false also forgets them; "clear-history" (no key by default) empties the list.
remember = true

[session]
# Open the tabs of last time at start, in order, with the one in front and the locks (kept
# in state.toml, this computer's own). false: one tab in start-folder, the kept tabs forgotten.
restore = true

[terminal]
# The terminal "Open terminal" runs: a program and its arguments, {dir} is the folder ("{{"
# and "}}" are braces). Unset: Gezik finds one (Windows Terminal, else PowerShell; Terminal on
# macOS; $TERMINAL, x-terminal-emulator or a terminal it knows on Linux).
# Through cmd or a .bat/.cmd file, a folder with % & | < > ^ " ( ) ! in its name is refused.
# Give {dir} as an argument of its own (or a flag's value), never inside code for a shell
# (["powershell", "-Command", "cd {dir}"], ["bash", "-c", "cd {dir}"], cmd /c): the folder's
# name would run there as code, as administrator too.
# command = ["wezterm", "start", "--cwd", "{dir}"]

[search]
# Windows: ask Everything (voidtools) for names when it runs; "off": Gezik's own scanner always.
everything = "auto"        # auto | off
skip = [".git", "node_modules"]   # folders a search does not go into (by name)
max-results = 250000       # 1000-2000000; a search stops there
content-max-size = "64 MB" # larger files are not read for text

[system]
# A second `gezik` (a folder from the command line, a script, another app) opens in the
# window used last instead of a new process; `gezik --new-window` opens a new window in it.
# Off: every `gezik` is a process of its own. Read at start.
single-instance = true
# macOS: Space opens the system Quick Look panel ("system") or Gezik's own window ("gezik").
# Windows and Linux always use Gezik's own.
quick-look = "system"     # system | gezik
# An icon in the notification area (macOS: menu bar; Linux: tray). With it, closing the
# window keeps Gezik running; quit from the icon's menu. Turned on in System Integration.
tray = false
# A system-wide shortcut that shows or hides Gezik from any app, e.g. "win+shift+e"
# (macOS "cmd+alt+e", Linux "super+shift+e"). "" is off; there is no default. A letter, a
# digit or F1-F12 with Win/Super, or with Ctrl+Shift or Alt+Shift (one modifier alone is every
# app's own: Ctrl+C, Alt+F4); Ctrl+Alt is not used (AltGr); Win+L, D, E, R and Win+<digit> are
# the system's. macOS: Cmd or Ctrl with Option or Shift (Cmd alone is every app's own).
hotkey = ""
# Start at login is not a setting: System Integration > Start at login (a system change).

[sidebar]
# OneDrive, iCloud Drive, Dropbox, Google Drive … under CLOUD, found by Gezik. Rows in these
# folders show whether a file is only in the cloud either way.
cloud = true
# TAGS: your [tags] list, a click shows the files with that tag (macOS: Spotlight).
tags = true
# The sidebar's folder tree opens down to the folder shown, as Explorer's "Expand to open
# folder" (each closed folder above it is read once). Off: Show in Sidebar Tree does it once.
tree-follow = false

[panes]
# F5/F6 ask before copying or moving to the other pane (its folder can be changed there).
confirm = true

[tags]
# Your tags, in order: the first seven get the keys Alt+Shift+1…7 (macOS ⌃1…⌃7).
# color: red, orange, yellow, green, blue, purple, gray or none.
list = [
  { name = "Red", color = "red" },
  { name = "Orange", color = "orange" },
  { name = "Yellow", color = "yellow" },
  { name = "Green", color = "green" },
  { name = "Blue", color = "blue" },
  { name = "Purple", color = "purple" },
  { name = "Gray", color = "gray" },
]
# false: keep every tag in Gezik's own store, never in the files (read when Gezik starts).
write-to-files = true
# Tag dots beside names: "auto" (macOS: on; else on once you tag a file), true or false.
dots = "auto"

[preview]
# The preview pane and Quick Look show a file's properties under its facts (camera, artist,
# length, pages …), read from the file by Gezik when it is previewed. Off: nothing is read.
properties = true

[shortcuts]
# Change any shortcut; "mod" is Cmd on macOS and Ctrl elsewhere; "" disables.
# F3 now opens a second pane. Search is Ctrl+Shift+F or Ctrl+E.
# new-tab = "mod+t"
# new-window = "mod+n"     # a new window (the same Gezik) at the folder shown
# close-tab = "mod+w"
# next-tab = "ctrl+tab"
# prev-tab = "ctrl+shift+tab"
# back = "alt+left"        # macOS: "mod+["
# forward = "alt+right"    # macOS: "mod+]"
# up = "alt+up"            # macOS: "mod+up"
# focus-path = "mod+l"
# refresh = ["f5", "ctrl+r"]   # with two panes F5 copies: Ctrl+R refreshes; macOS: "mod+r"
# select-all = "mod+a"
# view-list = "mod+shift+1"
# view-grid = "mod+shift+2"
# view-columns = "ctrl+shift+3"   # Miller columns (the list in search, flat view, trash); macOS: "mod+ctrl+3"
# toggle-preview = "alt+p"
# quick-look = "space"     # only while the file list has the focus
# copy = "mod+c"
# cut = "mod+x"
# paste = "mod+v"
# paste-move = ""          # macOS: "mod+alt+v" (paste what was copied as a move)
# trash = "delete"         # macOS: "mod+backspace"
# delete-permanently = "shift+delete"   # macOS: "mod+alt+backspace"
# rename = "f2"            # macOS: "enter"
# new-folder = "mod+shift+n"
# duplicate = ""           # macOS: "mod+d"
# undo = "mod+z"
# redo = "mod+y"           # macOS: "mod+shift+z"
# batch-rename = ""        # rename with rules, even for one item
# toggle-hidden = "ctrl+h" # show or hide names starting with a dot; macOS: "mod+shift+."
# filter = "mod+f"         # also "/" on the file list (not changeable)
# invert-selection = "mod+shift+i"
# select-pattern = ["mod+=", "num+"]     # num+ is the keypad's +; a list gives several keys
# deselect-pattern = ["mod+-", "num-"]
# select-same-type = "alt+num+"
# restore-selection = "num/"   # the selection before the last file operation
# tab-1 = "mod+1"          # tab-2 … tab-8 likewise
# tab-last = "mod+9"
# reopen-tab = "mod+shift+t"
# tab-picker = "mod+shift+a"
# toggle-tab-lock = ""     # a locked tab does not close
# clear-history = ""     # forget the folders the address bar remembers
# open-terminal = ["shift+f4", "ctrl+alt+t"]   # macOS: "mod+alt+t"
# open-terminal-admin = ""   # Windows only: the terminal as administrator
# copy-path = "ctrl+shift+c"   # the selected items' paths as text; macOS: "mod+alt+c"
# save-tab-set = ""        # save the open tabs under a name
# pin-1 = "alt+1"          # the first pinned folder; pin-2 … pin-9 likewise; macOS: "mod+alt+1"
# new-folder-with-selection = "ctrl+alt+n"   # the selected items into a new folder; macOS: "mod+ctrl+n" (may type a letter with AltGr on some layouts: pick another key then)
# add-to-stack = "mod+shift+s"   # the selected items onto the drop stack
# toggle-stack = ""        # show or hide the drop stack
# show-history = ""        # the operations panel's History
# search = ["mod+shift+f", "ctrl+e"]   # search under the folder shown; macOS: "mod+shift+f" (F3 is the system's)
# flat-view = "mod+b"      # every file under the folder in one list; again: back to the folder
# show-in-folder = "mod+shift+e"   # a search result's folder, with it selected
# copy-with-folders = ""   # copy search results keeping their folders
# cut-with-folders = ""    # the same as a move
# command-palette = "mod+shift+p"   # every action, command and view option by name
# quick-open = "mod+p"     # pinned and recent folders, tabs, tab sets, saved searches; ">" for commands
# calculate-folder-sizes = ""   # the selected folders' sizes (all shown if none), on any drive
# save-search = ""         # the search bar's search, under a name ([[searches]])
# make-alias = ""          # macOS: "mod+ctrl+a" (a Finder alias of the selected items)
# show-package-contents = ""   # macOS: go into an app or another package as a folder
# share = ""                   # macOS: Finder's Share… for the selected items
# show-trash = ""          # the Recycle Bin / Trash: every bin in one list
# put-back = ""            # in the trash: the selected items back where they were
# empty-trash = ""         # delete everything in the trash for good (asks first); macOS: mod+shift+backspace
# system-integration = ""   # the System Integration panel: gezik on the command line, the changes Gezik made, Undo all
# always-keep-offline = ""   # cloud folders: always keep the chosen items on this device (macOS: Download Now)
# free-up-space = ""         # cloud folders: free up the chosen synced items' space (macOS: Remove Download)
# get-info = "alt+enter"       # Get Info (Windows: the system's Properties); macOS: "mod+i"
# connect-to-server = "mod+k"  # Connect to Server: a share by its address (\\server\share, smb://server/share)
# eject = ""   # Eject the selected drive, or the shown folder's (a network drive: Disconnect); macOS: "mod+e"
# group-none = ""   # Group by ▸ None: the list without group headers
# group-type = ""   # Group by ▸ Type (the Type column's text)
# group-date = ""   # Group by ▸ Date: Today, Yesterday, Earlier this week …
# group-size = ""   # Group by ▸ Size: Empty, Tiny … Gigantic, Folders
# collapse-groups = ""   # Collapse All Groups (a grouped view)
# expand-groups = ""   # Expand All Groups
# reveal-in-tree = ""   # Show in Sidebar Tree: opens the sidebar tree down to the folder shown
# toggle-dual-pane = "f3"   # Two Panes: opens or closes the second pane; macOS: "mod+ctrl+p"
# focus-other-pane = "tab"   # the other pane takes the keyboard (only with two panes, the file list focused)
# copy-to-other-pane = "f5"  # the selection into the other pane's folder (only with two panes; F5 refreshes with one)
# move-to-other-pane = "f6"  # the same as a move (only with two panes)
# move-tab-to-other-pane = ""   # the active tab into the other pane (opens it first)
# sync-browsing = ""   # Sync Browsing: a step into a sub-folder or up is made in both panes
# swap-panes = "ctrl+u"   # Swap Panes: the two panes trade their tabs; macOS: "mod+ctrl+u"
# other-pane-same-folder = ""   # the other pane goes to the active pane's folder
# move-tab-to-new-window = ""   # the active tab into a new window (a window's only tab stays)
# compare = "shift+f2"     # two selected files side by side, or two folders (or the two panes' folders); macOS: "mod+ctrl+c"
# select-differences = ""   # selects in both panes what the other pane lacks or has older
# export-list = ""              # the list shown as text, CSV or HTML, to a file or the clipboard
# size-map = ""   # Size Map: the selected folder (else the one shown) as nested boxes by size
# checksums = ""   # Calculate Checksums…: CRC32, MD5, SHA-1, SHA-256, SHA-512 of the selected files
# verify-checksums = ""   # checks the files a selected .sha256, .md5, .sfv, SHA256SUMS… names
# find-duplicates = ""   # Find Duplicates: the search bar finds files with the same content, in groups
# copy-to = ""   # Copy To…: into a typed folder; a name mask (D:\Yedek\*.bak) and Filter… (*.jpg | thumbs\)
# move-to = ""   # Move To…: the same, moving
# split-file = ""   # Split File…: the selected file into .001, .002… parts and a .crc
# join-files = ""   # Join Files: the parts of the selected .001 (or .crc) into one file, checked by CRC
# tags = "ctrl+shift+l"   # Tags…: the tag picker for the selection; macOS: "mod+ctrl+l"
# tag-1 = "alt+shift+1"    # the first tag of [tags] list on (or, when all have it, off) the selection; tag-2 … tag-7 likewise; macOS: "ctrl+1"
# clear-tags = "alt+shift+0"   # takes every tag off the selection; macOS: "ctrl+0"
# edit-comment = ""        # Comment…: asks for the selection's comment (no key by default)
# clean-tag-store = ""     # Clean Up Tag Store…: removes, when you say so, entries of files that are gone
# preview-hex = ""  # Show Preview as Hex: the selected file's bytes in the preview, or back to its text or picture
# preview-play = ""  # Play/Pause Preview: the selected video or sound file plays in the preview, or pauses

# Saved rule sets for batch rename (Rename… with two or more items selected). The rename
# layer writes them with "Presets ▾ › Save current rules as…"; they can also be written here.
# Saving or deleting a set there rewrites the saved sets (comments inside a set that changed are not kept).
# [[rename-presets]]
# name = "Holiday photos"
# include-extension = false
# rules = [
#   { kind = "template", text = "{taken:%Y-%m-%d} {n:03}" },
#   { kind = "case", mode = "lower" },
# ]

# Saved filters, listed by the filter bar's ▾ button ("Save as…" there writes them here).
# The pattern is the filter's own: parts split by ";", * and ? as wildcards (a part without
# them matches anywhere in the name), "!" in front leaves out.
# [[filters]]
# name = "Pictures"
# pattern = "*.jpg;*.jpeg;*.png;*.heic;*.webp"

# Tab sets: tabs opened together from a tab's right-click menu ("Open tab set >"; "Save tabs
# as…" there writes them here). "drives" is This PC; tokens like {home} work on every OS.
# [[tab-sets]]
# name = "Release"
# tabs = ["{documents}/Projects", "{downloads}", "drives"]
# right = ["{downloads}"]   # optional: the second pane's tabs (it opens with the set)

# Saved searches, run from the search bar's ▾ menu, the palette (Ctrl+P) and the sidebar's
# SEARCHES ("Save search…" in the ▾ menu writes them here). folder is a path, "{here}" (the
# folder shown when it runs) or "drives" (This PC); tokens like {home} work on every OS. The other
# keys are the search bar's: pattern (the filter's language), content (text in files),
# name-regex, content-regex, match-case, hidden, skipped (true or false), size-min, size-max
# ("500 MB"), modified (today | 7d | 30d | year | 2026-01-01..2026-06-30) and type (files |
# folders | pictures | videos | audio | documents | archives | code). duplicates = true finds
# duplicate files instead (Find Duplicates). tags = ["Red"] (every one), untagged = true,
# min-rating = 4 (stars) and comment = "review" (text in the comment) look at the tags; pattern
# may say them too (tag:Red rating:4 comment:review). where takes property words, as the filter
# bar does ("artist:tarkan duration>3m"; only files with a reader for a field are read). At
# most 30.
# [[searches]]
# name = "Large videos"
# folder = "{home}"
# pattern = "*.mp4;*.mkv"
# size-min = "500 MB"
# modified = "30d"
# type = "videos"

# Folder syncs, saved by the folder compare's "Save Profile…" and opened from the palette
# ("Sync: Photos backup"), where they only compare: nothing is copied before the summary
# question. mode is two-way (newer wins; stateless: a file deleted on one side is copied back
# from the other), left-to-right (update) or mirror (the right becomes the left; what only the
# right has goes to its trash). filter is the compare's (*.jpg *.cr2 | thumbs\). At most 40.
# [[sync-profiles]]
# name = "Photos backup"
# left = "{pictures}/2024"
# right = "E:/Yedek/foto"
# mode = "mirror"
# subfolders = true
# content = false
# ignore-dates = false
# ignore-hour = false
# filter = "*.jpg *.cr2 | thumbs\\"

# View rules: the first rule that matches a folder sets its view, unless you changed that
# folder's view yourself (the View menu's "Reset to rule" forgets that). A rule matches by
# path (* and ? within a name, ** for any folders below; ~ and tokens like {pictures} work;
# case is ignored on Windows), by kind (drives | trash | search | flat | network | removable |
# cloud) and by content ("pictures >= 50%" of the items shown; pictures, videos, audio,
# documents, archives, code or folders); with more than one, all must match. Search results
# match by kind only. A rule sets mode (list | grid | columns), sort, sort-dir, group, grid-size and
# columns (modified, created, type, size, tags, rating, comment; name always shows); what it leaves out stays
# [view]'s. A rule with a mistake is reported and left out.
# [[view-rules]]
# path = "{pictures}/**"
# mode = "grid"
# grid-size = "large"
#
# [[view-rules]]
# kind = "network"
# mode = "list"
# columns = ["modified", "size"]
#
# [[view-rules]]
# content = "pictures >= 50%"
# mode = "grid"
#
# [[view-rules]]
# path = "~/Downloads"
# sort = "modified"
# sort-dir = "desc"
# group = "date"

# Highlight rules: the first rule that matches a row colors its text and/or makes its name
# bold (Total Commander's color rules); at most 64. Conditions, all of which must hold:
# name (patterns as in a filtered copy: "*.tmp *.bak | keep*", "node_modules/" for folders),
# kind (folder, file, pictures, videos, audio, documents, archives, code), newer-than and
# older-than ("12h", "7d", "2w", "3m", "1y"; the modified time), min-size and max-size
# ("100 MB"), hidden (true or false), tag (a name, "any" or "none"), rating (0: not rated;
# n: at least n stars), comment ("any" or a text it holds). Looks: color (red, orange,
# yellow, green, blue, purple, gray or "#rrggbb"), dark-color (the dark theme's), bold.
# Tags, ratings and comments are read only while a rule asks for them.
# [[highlight-rules]]
# name = "*.tmp *.bak ~*"
# color = "gray"
#
# [[highlight-rules]]
# tag = "Red"
# bold = true
#
# [[highlight-rules]]
# kind = "folder"
# newer-than = "1d"
# color = "#2e7d32"
# dark-color = "#81c784"
#
# [[highlight-rules]]
# min-size = "1 GB"
# rating = 0
# color = "orange"

# Your own commands, shown in the Convert layer under "Commands" and in the right-click
# menu under "Commands >" (only for files that match "types"). No shell is used: "run" is a
# program followed by its arguments, and placeholders are replaced inside each argument, so
# file names with spaces or quotes are safe. Write "{{" and "}}" for a literal { or }.
# Placeholders: {in} (full path), {dir}, {name}, {ext} (no dot), {out} (the full output
# path, in a temporary folder of Gezik's) and {outdir} (that folder, for a program that names
# its output itself). "output" is the output's file name ({name} and {ext} only): once the
# command ends, Gezik moves the file of that name from the temporary folder to its place.
# Without "output" the command changes the file in place and Gezik first keeps a copy in the
# recycle bin so Undo works. "types" lists file endings without the dot ("jpg", "tar.gz";
# a leading dot is ignored, * and ? are not allowed); without it the command shows for every
# file. Also: folders = true (run on folders too), parallel = 1-16 (how many run at once,
# default 1). The program is looked up in PATH or given as a full path. A command that is
# not valid, or has a key not named here (a typo), is reported and left out.
# {files} puts in every selected item (full paths, one argument each) and runs the command
# once, in their folder; it can't be used with {in}, {name}, {ext}, {out} or "output", and
# what it does can't be undone. shortcut = "ctrl+alt+z" runs a command on the selection while
# the file list has the keyboard (the keys of [shortcuts], with Ctrl, Alt or Cmd, or an F key;
# a key already taken is left out, with a warning); menu = "Archives" lists it under that
# heading in "Commands >"; ask = true asks "Run … on N items?" first. Ctrl+Alt+letter may type a
# character on some layouts (AltGr on Windows), so the command never runs: pick another key then.
# [[commands]]
# name = "Resize to 50% (ImageMagick)"
# run = ["magick", "{in}", "-resize", "50%", "{out}"]
# output = "{name}-small.{ext}"
# types = ["jpg", "jpeg", "png"]
# parallel = 4
#
# [[commands]]
# name = "Office to PDF (LibreOffice)"
# run = ["soffice", "--headless", "--convert-to", "pdf", "--outdir", "{outdir}", "{in}"]
# output = "{name}.pdf"
# types = ["docx", "doc", "xlsx", "pptx", "odt"]
#
# [[commands]]
# name = "E-book to EPUB (Calibre)"
# run = ["ebook-convert", "{in}", "{out}"]
# output = "{name}.epub"
# types = ["mobi", "azw3", "fb2"]
#
# [[commands]]
# name = "Zip together (7-Zip)"
# run = ["7z", "a", "-tzip", "together.zip", "{files}"]
# folders = true
# shortcut = "ctrl+alt+z"
# menu = "Archives"
# ask = true
