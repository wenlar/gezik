[package]
name = "gezik-core"
description = "Platform-independent core of the Gezik file manager"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gezik-i18n.workspace = true
# NFC for Git's names on macOS (the version gezik-search already links).
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
# GitHub's release list (update.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
