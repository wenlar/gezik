[package]
name = "gezik-batch"
description = "Batch operations of the Gezik file manager: rename rules, and later archives and conversion"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gezik-core.workspace = true
# Extracting runs as engine tasks (questions, staging, placing with one undo).
gezik-ops.workspace = true
# Local time for zip's DOS dates, the hidden attribute of extracted files, free space, and
# running 7-Zip.
gezik-platform.workspace = true
# Unicode \w and case-insensitive matching, no other Unicode tables (size). No `perf`:
# names are short, and it measured 0.45 MB of the release exe.
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
kamadak-exif = "0.6"
# Archives, all pure Rust. zip's zstd/lzma/xz and sevenz's deflate stay off (C code, a second
# lzma copy, and a switch of the whole binary's flate2 to zlib-rs).
zip = { version = "8.6.0", default-features = false, features = ["aes-crypto", "deflate-flate2", "deflate64", "bzip2"] }
sevenz-rust2 = { version = "0.23.0", default-features = false, features = ["aes256", "compress", "bzip2", "ppmd"] }
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.10"
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "encoder", "optimization", "xz"] }
bzip2 = "0.6.1"
ruzstd = { version = "0.9.0", default-features = false, features = ["std"] }
# RAR through UnRAR (C++, freeware licence: extraction only; see THIRD-PARTY.md).
unrar-ng = { version = "0.7.7", default-features = false, optional = true }
cab = "0.6.0"
# ISO 9660 with Joliet and Rock Ridge; no UDF (7-Zip reads those).
hadris-iso = { version = "2.5.0", default-features = false, features = ["std", "sync", "read"] }
# newc only; odc is read by our own parser.
cpio = "0.4.1"
ar = "0.9.0"

[features]
default = ["rar"]
# RAR through UnRAR's C++ (needs a C++ compiler for the target); without it RAR archives go
# to 7-Zip.
rar = ["dep:unrar-ng"]

[dev-dependencies]
# Writes the ISO images the tests read.
hadris-iso = { version = "2.5.0", default-features = false, features = ["std", "sync", "read", "write"] }
