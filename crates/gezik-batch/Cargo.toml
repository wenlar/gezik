[package]
name = "gezik-batch"
description = "Batch operations of the Gezik file manager: rename rules, and later archives and conversion"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gezik-core.workspace = true
# Extracting runs as engine tasks (questions, staging, placing with one undo).
gezik-ops.workspace = true
# Local time for zip's DOS dates, the hidden attribute of extracted files, free space, and
# running 7-Zip.
gezik-platform.workspace = true
# Unicode \w and case-insensitive matching, no other Unicode tables (size). No `perf`:
# names are short, and it measured 0.45 MB of the release exe.
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
kamadak-exif = "0.6"
# Archives, all pure Rust. zip's zstd/lzma/xz and sevenz's deflate stay off (C code, a second
# lzma copy, and a switch of the whole binary's flate2 to zlib-rs).
zip = { version = "8.6.0", default-features = false, features = ["aes-crypto", "deflate-flate2", "deflate64", "bzip2"] }
sevenz-rust2 = { version = "0.23.0", default-features = false, features = ["aes256", "compress", "bzip2", "ppmd"] }
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.10"
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "encoder", "optimization", "xz"] }
bzip2 = "0.6.1"
ruzstd = { version = "0.9.0", default-features = false, features = ["std"] }
# RAR through UnRAR (C++, freeware licence: extraction only; see THIRD-PARTY.md).
unrar-ng = { version = "0.7.7", default-features = false, optional = true }
cab = "0.6.0"
# ISO 9660 with Joliet and Rock Ridge; no UDF (7-Zip reads those).
hadris-iso = { version = "2.5.0", default-features = false, features = ["std", "sync", "read"] }
# newc only; odc is read by our own parser.
cpio = "0.4.1"
ar = "0.9.0"
# Checks downloaded tools. 0.11: the version lzma-rust2 and sevenz-rust2 already bring.
sha2 = "0.11"
# Converting pictures: gezik-platform's decoders plus TIFF and ICO; the encoders come with
# the same features.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
# JPEG output: optimized Huffman tables (18% smaller than image's encoder, twice as fast).
jpeg-encoder = "0.7.1"
# Lanczos3 resizing, one pixel type only (`resize_typed`) and no rayon: each picture runs on
# its own core already, and every other pixel type's kernels cost about 1.5 MB.
fast_image_resize = { version = "6.1.0", default-features = false, features = ["image"] }
# Converting text: every WHATWG encoding (encoding_rs) and guessing a file's encoding when it
# has no BOM (chardetng).
encoding_rs = "0.8.42"
chardetng = "1.0.0"
# Images to PDF: pdf-writer writes the objects (each streamed to the file as it is made),
# miniz_oxide compresses samples and ICC profiles (already linked through flate2).
pdf-writer = "0.15.0"
miniz_oxide = "0.9.1"
# Reading PDFs (merge, split, extract, pages to pictures), only ever in the worker process
# (`gezik --pdf-worker`): pdfium is loaded at run time from the library Gezik downloads. No
# `thread_safe` (one thread per worker) and no `image_*` (`as_rgba_bytes` is enough).
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881"] }

[features]
default = ["rar"]
# RAR through UnRAR's C++ (needs a C++ compiler for the target); without it RAR archives go
# to 7-Zip.
rar = ["dep:unrar-ng"]

[dev-dependencies]
# Writes the ISO images the tests read.
hadris-iso = { version = "2.5.0", default-features = false, features = ["std", "sync", "read", "write"] }
