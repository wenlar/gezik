[package]
name = "gezik-search"
description = "Searching folder trees for the Gezik file manager: the scanner, name and content matchers, Everything"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gezik-core.workspace = true
gezik-platform.workspace = true
# gezik-batch's regex features plus the Unicode classes (p{L}, p{Latin}), which the RAR build has anyway.
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl", "unicode-gencat", "unicode-script"] }
