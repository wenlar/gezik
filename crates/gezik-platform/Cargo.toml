[package]
name = "gezik-platform"
description = "Platform-specific parts of the Gezik file manager: drives, known folders, native menus"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gezik-core.workspace = true
dirs = "7"
raw-window-handle = "0.6"
# Only the formats Gezik previews itself; the system shows the rest.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Encodes pasted pictures as PNG (already built for image).
png = { version = "0.18", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_WNet",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# The #[implement] macro (a COM progress sink for the Recycle Bin) expands to windows_core paths.
windows-core = "0.62"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# The clipboard and drag and drop on X11 (Gezik's own connection; winit uses x11rb too).
x11rb = { version = "0.13", features = ["xfixes"] }
# The clipboard and drag and drop on Wayland, on winit's own connection.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dev-dependencies]
# examples/vpointer.rs: a pointer for trying drag and drop in a headless compositor.
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Blocks for NSURLSession's completion handler (the version objc2 0.6 brings).
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSError",
    "NSFileManager",
    "NSGeometry",
    "NSLocale",
    "NSOperation",
    "NSString",
    "NSURL",
    "NSURLRequest",
    "NSURLResponse",
    "NSURLSession",
    "block2",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSBitmapImageRep",
    "NSDragging",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSEvent",
    "NSImage",
    "NSImageRep",
    "NSPasteboard",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
