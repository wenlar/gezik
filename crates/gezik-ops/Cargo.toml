[package]
name = "gezik-ops"
description = "File operations engine of the Gezik file manager: queue, conflicts, progress, undo"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gezik-core.workspace = true
gezik-platform.workspace = true
# Checksums (spec 11 §3.2): sha1, sha2 and crc32fast are linked already (zip's AES, the tool
# downloads, flate2); md-5 is the only new code (the same RustCrypto `digest` 0.11 family).
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
crc32fast = "1.5"

[target.'cfg(unix)'.dependencies]
# The uid and home that name this user's bins (a delete from the trash checks its items).
libc = "0.2"
dirs = "7"
