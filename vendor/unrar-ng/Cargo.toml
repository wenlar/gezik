[package]
edition = "2024"
rust-version = "1.85"
name = "unrar-ng"
version = "0.7.7"
authors = [
    "Danyel Bayraktar <rust@danyel.io>",
    "vjoki <vjoki@zv.fi>",
    "ttys3 <41882455+ttys3@users.noreply.github.com>",
]
build = false
