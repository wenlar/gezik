name: Release

# A pushed tag `v<version>` builds every package and opens a draft GitHub Release with them;
# by hand (Actions ▸ Release ▸ Run workflow, or `gh workflow run release.yml -f version=0.1.0`)
# it only builds and uploads them as workflow artifacts. See docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version written into the packages (e.g. 0.1.0)"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then v=${GITHUB_REF_NAME#v}; else v=$INPUT; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$' || { echo "bad version: $v"; exit 1; }
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # A tag must match Cargo.toml, so the binary and the package agree.
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$v" != "$cargo" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    # Azure trusts this job's OIDC token through a federated credential bound to the
    # `release` environment.
    environment: release
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Marks the packages that replace themselves on an update (crates/gezik/src/update.rs).
      GEZIK_RELEASE_BUILD: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      # dtolnay/rust-toolchain has no release tags: pinned to the `stable` branch's commit.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release
      - run: cargo build --release -p gezik
      # Authenticode signing with Azure Artifact Signing (docs/releasing.md#windows-signing).
      # Skipped until the repository variables exist, so unsigned builds still work.
      - if: vars.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - if: vars.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files: ${{ github.workspace }}\target\release\gezik.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      # Two zips: the plain one keeps settings in %APPDATA%\gezik; the portable one has the
      # empty `gezik-portable` marker next to gezik.exe, so settings stay in gezik-data\ beside it.
      - name: Package
        run: |
          New-Item -ItemType Directory dist | Out-Null
          foreach ($kind in 'plain', 'portable') {
            $name = if ($kind -eq 'plain') { "gezik-$env:VERSION-windows-x64" } else { "gezik-$env:VERSION-windows-x64-portable" }
            $dir = "stage\$name"
            New-Item -ItemType Directory $dir | Out-Null
            Copy-Item target\release\gezik.exe, LICENSE.md, THIRD-PARTY.md, README.md $dir
            if ($kind -eq 'portable') { New-Item -ItemType File "$dir\gezik-portable" | Out-Null }
            Compress-Archive -Path $dir -DestinationPath "dist\$name.zip"
          }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      # Marks the packages that replace themselves on an update (crates/gezik/src/update.rs).
      GEZIK_RELEASE_BUILD: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release
      - name: Build (arm64 and x86_64)
        run: |
          cargo build --release -p gezik --target aarch64-apple-darwin
          cargo build --release -p gezik --target x86_64-apple-darwin
          mkdir -p stage
          lipo -create -output stage/gezik \
            target/aarch64-apple-darwin/release/gezik target/x86_64-apple-darwin/release/gezik
      # Developer ID signing and notarization (docs/releasing.md#macos-signing); skipped until
      # the secrets exist, then make-app.sh signs ad hoc as before.
      - name: Signing keychain
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc=$RUNNER_TEMP/sign.keychain-db; pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          [ -n "$id" ] || { echo "no Developer ID Application identity in the certificate"; exit 1; }
          echo "SIGN_IDENTITY=$id" >> "$GITHUB_ENV"
      - name: Gezik.app
        run: |
          mkdir -p stage/dmg
          scripts/macos/make-app.sh stage/gezik "$VERSION" stage/dmg
          cp LICENSE.md THIRD-PARTY.md README.md stage/dmg/
          ln -s /Applications stage/dmg/Applications
      # Before the dmg and the update tarball, so both carry the stapled ticket. Usually minutes;
      # a new team's first submissions can take hours, then the run fails within the job limit.
      - name: Notarize
        if: env.MACOS_CERT_P12 != ''
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/key.p8"
          ditto -c -k --keepParent stage/dmg/Gezik.app "$RUNNER_TEMP/Gezik.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Gezik.zip" --wait --timeout 75m \
            --key "$RUNNER_TEMP/key.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          rm "$RUNNER_TEMP/key.p8"
          # Fails when Apple refused it: there is no ticket to staple.
          xcrun stapler staple stage/dmg/Gezik.app
          spctl --assess --type exec -vv stage/dmg/Gezik.app
      - name: Disk image
        run: |
          mkdir -p dist
          # hdiutil now and then fails on hosted runners with "Resource busy": try again.
          for i in 1 2 3; do
            hdiutil create -volname Gezik -srcfolder stage/dmg -fs HFS+ -format UDZO -ov \
              "dist/gezik-$VERSION-macos-universal.dmg" && break
            [ $i = 3 ] && exit 1; sleep 10
          done
          hdiutil verify "dist/gezik-$VERSION-macos-universal.dmg"
      # The same Gezik.app for the automatic update (docs/releasing.md): a tarball Gezik unpacks
      # itself, no disk image to mount. No AppleDouble files or extended attributes in it.
      - name: Update package
        run: |
          COPYFILE_DISABLE=1 tar --no-mac-metadata -C stage/dmg -czf "dist/gezik-$VERSION-macos-universal.app.tar.gz" Gezik.app
          tar -tzf "dist/gezik-$VERSION-macos-universal.app.tar.gz" | grep -qx 'Gezik.app/Contents/MacOS/gezik'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-24.04
    # Built in Debian trixie, as CI and scripts/linux/Dockerfile: the binary needs its glibc
    # (2.41) or what package.sh reports. --init reaps the smoke run's processes.
    container:
      image: rust:1-trixie
      options: --init
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Marks the packages that replace themselves on an update (crates/gezik/src/update.rs).
      GEZIK_RELEASE_BUILD: "1"
    steps:
      - name: Install Linux packages
        # scripts/linux/Dockerfile's build libraries plus Xvfb and xdotool for package.sh's
        # smoke run, and desktop-file-utils for appimage.sh.
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            g++ pkg-config libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev \
            libxcb1 libxcursor1 libxi6 libxrandr2 libx11-6 libx11-xcb1 \
            fonts-dejavu-core dbus xvfb xdotool desktop-file-utils
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release
      # package.sh works in /src and names the tarball gezik-$SHA-linux-x64.tar.gz; the version
      # stands in for the SHA. It builds, packs and starts the unpacked binary under Xvfb.
      - name: Build and package
        run: |
          ln -s "$GITHUB_WORKSPACE" /src
          SHA="$VERSION" OUT="$GITHUB_WORKSPACE/dist" bash scripts/linux/package.sh
      - name: AppImage
        run: bash scripts/linux/appimage.sh target/release/gezik "$VERSION" dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: docs/release-notes-unsigned.md
          sparse-checkout-cone-mode: false
          path: src
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # A version with a suffix (0.1.0-rc.1) is marked as a pre-release.
          pre=(); case "$VERSION" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft "${pre[@]}" \
            --verify-tag --title "Gezik $VERSION" --notes-file src/docs/release-notes-unsigned.md --generate-notes
