name: Release

# A pushed tag `v<version>` builds every package and opens a draft GitHub Release with them;
# by hand (Actions ▸ Release ▸ Run workflow, or `gh workflow run release.yml -f version=0.1.0`)
# it only builds and uploads them as workflow artifacts. See docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version written into the packages (e.g. 0.1.0)"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then v=${GITHUB_REF_NAME#v}; else v=$INPUT; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$' || { echo "bad version: $v"; exit 1; }
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # A tag must match Cargo.toml, so the binary and the package agree.
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$v" != "$cargo" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      # dtolnay/rust-toolchain has no release tags: pinned to the `stable` branch's commit.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release
      - run: cargo build --release -p gezik
      # Two zips: the plain one keeps settings in %APPDATA%\gezik; the portable one has the
      # empty `gezik-portable` marker next to gezik.exe, so settings stay in gezik-data\ beside it.
      - name: Package
        run: |
          New-Item -ItemType Directory dist | Out-Null
          foreach ($kind in 'plain', 'portable') {
            $name = if ($kind -eq 'plain') { "gezik-$env:VERSION-windows-x64" } else { "gezik-$env:VERSION-windows-x64-portable" }
            $dir = "stage\$name"
            New-Item -ItemType Directory $dir | Out-Null
            Copy-Item target\release\gezik.exe, LICENSE.md, THIRD-PARTY.md, README.md $dir
            if ($kind -eq 'portable') { New-Item -ItemType File "$dir\gezik-portable" | Out-Null }
            Compress-Archive -Path $dir -DestinationPath "dist\$name.zip"
          }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release
      - name: Build (arm64 and x86_64)
        run: |
          cargo build --release -p gezik --target aarch64-apple-darwin
          cargo build --release -p gezik --target x86_64-apple-darwin
          mkdir -p stage
          lipo -create -output stage/gezik \
            target/aarch64-apple-darwin/release/gezik target/x86_64-apple-darwin/release/gezik
      - name: Gezik.app
        run: |
          mkdir -p stage/dmg
          scripts/macos/make-app.sh stage/gezik "$VERSION" stage/dmg
          cp LICENSE.md THIRD-PARTY.md README.md stage/dmg/
          ln -s /Applications stage/dmg/Applications
      - name: Disk image
        run: |
          mkdir -p dist
          # hdiutil now and then fails on hosted runners with "Resource busy": try again.
          for i in 1 2 3; do
            hdiutil create -volname Gezik -srcfolder stage/dmg -fs HFS+ -format UDZO -ov \
              "dist/gezik-$VERSION-macos-universal.dmg" && break
            [ $i = 3 ] && exit 1; sleep 10
          done
          hdiutil verify "dist/gezik-$VERSION-macos-universal.dmg"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-24.04
    # Built in Debian trixie, as CI and scripts/linux/Dockerfile: the binary needs its glibc
    # (2.41) or what package.sh reports. --init reaps the smoke run's processes.
    container:
      image: rust:1-trixie
      options: --init
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install Linux packages
        # scripts/linux/Dockerfile's build libraries plus Xvfb and xdotool for package.sh's
        # smoke run, and desktop-file-utils for appimage.sh.
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            g++ pkg-config libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev \
            libxcb1 libxcursor1 libxi6 libxrandr2 libx11-6 libx11-xcb1 \
            fonts-dejavu-core dbus xvfb xdotool desktop-file-utils
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release
      # package.sh works in /src and names the tarball gezik-$SHA-linux-x64.tar.gz; the version
      # stands in for the SHA. It builds, packs and starts the unpacked binary under Xvfb.
      - name: Build and package
        run: |
          ln -s "$GITHUB_WORKSPACE" /src
          SHA="$VERSION" OUT="$GITHUB_WORKSPACE/dist" bash scripts/linux/package.sh
      - name: AppImage
        run: bash scripts/linux/appimage.sh target/release/gezik "$VERSION" dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: docs/release-notes-unsigned.md
          sparse-checkout-cone-mode: false
          path: src
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # A version with a suffix (0.1.0-rc.1) is marked as a pre-release.
          pre=(); case "$VERSION" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft "${pre[@]}" \
            --verify-tag --title "Gezik $VERSION" --notes-file src/docs/release-notes-unsigned.md --generate-notes
