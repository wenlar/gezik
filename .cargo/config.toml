[env]
# UnRAR (unrar-ng-sys, C++) reports errors and a cancel by throwing. MSVC runs destructors
# while unwinding only with /EHsc, which the cc crate does not pass: without it a cancelled
# or failed entry left its file open (and its memory allocated).
CXXFLAGS_x86_64_pc_windows_msvc = "/EHsc"
CXXFLAGS_aarch64_pc_windows_msvc = "/EHsc"

# The C runtime is linked in: no vcruntime140.dll is looked for beside the exe, where anyone
# who can write that folder could put their own, which the administrator helper (spec 9
# §10.4) would load before its first line runs (9b7 security review 1).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
