      <div style="position:absolute;right:3px;top:calc(var(--row) + 6px);width:6px;height:120px;border-radius:3px;background:var(--scrollbar)"></div>

  <div style="height:var(--row);flex-shrink:0;display:flex;align-items:stretch;padding:0 var(--inset);font-size:var(--fs-sm);color:var(--muted);border-top:1px solid var(--seg);background:var(--status-bg);position:relative">

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;dir&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;a&quot;,&quot;b&quot;],&quot;default&quot;:&quot;a&quot;,&quot;tsType&quot;:&quot;'a'|'b'&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark'|'light'&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;magenta&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;list&quot;,&quot;grid&quot;],&quot;default&quot;:&quot;list&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;comfortable&quot;,&quot;compact&quot;],&quot;default&quot;:&quot;comfortable&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pins&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  componentDidMount() {

    const vars = {

      '--border': c.border, '--border-strong': c['border-strong'], '--accent': c.accent, '--sel': c.selection,

      '--strip-border': A ? 'transparent' : c.border, '--toolbar-border': A ? 'transparent' : c.border,
      '--sidebar-bg': A ? c.chrome : c.background, '--sidebar-border': A ? 'transparent' : c.border,
      '--row-inset': A ? px(m.spacing) : '0px', '--row-radius': A ? px(m.radius) : '0px',
