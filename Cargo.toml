[workspace]
resolver = "3"
members = ["crates/gezik-core", "crates/gezik-config", "crates/gezik-platform", "crates/gezik-ops", "crates/gezik-batch", "crates/gezik-search", "crates/gezik-i18n", "crates/gezik-vfs", "crates/gezik"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0-rc.2"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
gezik-core = { path = "crates/gezik-core" }
gezik-config = { path = "crates/gezik-config" }
gezik-platform = { path = "crates/gezik-platform" }
gezik-ops = { path = "crates/gezik-ops" }
# Without RAR unless asked for (gezik forwards its own `rar` feature).
gezik-batch = { path = "crates/gezik-batch", default-features = false }
gezik-search = { path = "crates/gezik-search" }
gezik-i18n = { path = "crates/gezik-i18n" }
gezik-vfs = { path = "crates/gezik-vfs" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# For A/B measurements while trying a change: the release build without whole-program
# optimisation, so a small change rebuilds in about a minute. Compare two builds of this
# profile with each other; final numbers come from `release`.
[profile.measure]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# Slint and unrar-ng with fixes that are not released yet; see vendor/README.md.
[patch.crates-io]
i-slint-core = { path = "vendor/i-slint-core" }
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit" }
i-slint-renderer-software = { path = "vendor/i-slint-renderer-software" }
unrar-ng = { path = "vendor/unrar-ng" }
