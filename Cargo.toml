[workspace]
resolver = "3"
members = ["crates/gezik-core", "crates/gezik-config", "crates/gezik-platform", "crates/gezik-ops", "crates/gezik-batch", "crates/gezik"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
gezik-core = { path = "crates/gezik-core" }
gezik-config = { path = "crates/gezik-config" }
gezik-platform = { path = "crates/gezik-platform" }
gezik-ops = { path = "crates/gezik-ops" }
gezik-batch = { path = "crates/gezik-batch" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Slint and unrar-ng with fixes that are not released yet; see vendor/README.md.
[patch.crates-io]
i-slint-core = { path = "vendor/i-slint-core" }
unrar-ng = { path = "vendor/unrar-ng" }
